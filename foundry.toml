[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
via_ir = false
ffi = false
fs_permissions = []
gas_reports = ["BMCIlluminatiPass"]

[fuzz]
runs = 64

[fmt]
line_length = 120
tab_width = 4

[lint]
lint_on_build = false
